<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hosting Account Terminated | royallife.ug</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f5f7;
      color: #252a34;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(620px, 100%);
      padding: 48px 36px 30px;
      text-align: center;
      background: #ffffff;
      border-top: 5px solid #c62828;
      border-radius: 8px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
    }

    .icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      place-items: center;
      border-radius: 50%;
      background: #ffebee;
      color: #c62828;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.2;
    }

    p {
      margin: 0 auto;
      max-width: 500px;
      color: #5f6672;
      font-size: 17px;
      line-height: 1.65;
    }

    .details {
      margin-top: 34px;
      padding-top: 20px;
      border-top: 1px solid #e4e6e9;
      color: #8a9099;
      font-size: 12px;
      line-height: 1.7;
    }

    .details span {
      display: inline-block;
      margin: 0 8px;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>Hosting Account Terminated</h1>
    <p>
      The hosting account for <strong>royallife.ug</strong> has been terminated.
      Please contact your website administrator to restore access.
    </p>

    <div class="details">
      <span>Domain: royallife.ug</span>
      <span>Service: cPanel Hosting</span>
      <span>Status: Terminated</span>
    </div>
  </main>
</body>
</html>
